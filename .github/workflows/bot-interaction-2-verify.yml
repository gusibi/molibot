name: bot-interaction-2-verify

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Interaction tests
        run: >
          node --import ./scripts/register-loader.js --import tsx --test
          src/lib/server/agent/interactions/service.test.ts
          src/lib/server/channels/telegram/interaction.test.ts
          src/lib/server/channels/feishu/interaction.test.ts
          src/lib/server/channels/telegram/runtime.test.ts
          src/lib/server/channels/feishu/messaging.test.ts
      - name: Production build
        run: pnpm run build
