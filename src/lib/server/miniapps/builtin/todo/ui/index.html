<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Todo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">

      <!-- Backdrop for picker -->
      <div class="backdrop" id="backdrop" hidden></div>

      <!-- Top bar -->
      <header class="topbar" id="topbar">
        <button class="topbar-btn" id="list-picker-btn" type="button" aria-label="Lists">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </button>
        <div class="topbar-center" id="list-selector-trigger">
          <h1 class="topbar-title" id="current-list-name">All</h1>
          <svg class="topbar-chevron" id="topbar-chevron" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </div>
        <span class="topbar-count" id="open-count"></span>
      </header>

      <!-- List picker -->
      <nav class="list-picker" id="list-picker" hidden>
        <div class="lp-scroll">
          <button class="lp-item" data-list-id="" type="button">
            <span class="lp-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22 7h-9v2h9V7zm0 8h-9v2h9v-2zM5.54 11L2 7.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 11zm0 8L2 15.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 19z"/></svg>
            </span>
            <span class="lp-name" data-i18n="all">All</span>
            <span class="lp-count" id="lp-all-count"></span>
          </button>
          <div class="lp-lists" id="lp-lists"></div>
        </div>
        <button class="lp-add" id="lp-add" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          <span data-i18n="newList">New List</span>
        </button>
      </nav>

      <!-- Search -->
      <div class="search-wrap">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input class="search-input" id="search" type="text" autocomplete="off" placeholder="Search" data-i18n-placeholder="search" />
      </div>

      <!-- Composer -->
      <div class="composer" id="composer">
        <form class="composer-form" id="composer-form" autocomplete="off">
          <div class="composer-header">
            <input class="composer-input" id="title" type="text" maxlength="300" placeholder="New To-Do" data-i18n-placeholder="newTodo" />
            <button class="composer-submit" type="submit" data-i18n="add">Add</button>
          </div>
          <div class="composer-options">
            <div class="opt-group">
              <button class="opt-btn" id="opt-priority" type="button">
                <span class="opt-dot pri-normal" id="pri-dot"></span>
                <span id="pri-label" data-i18n="normal">Normal</span>
              </button>
              <button class="opt-btn" id="opt-pin" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="opt-pin-icon">
                  <path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/>
                </svg>
                <span data-i18n="star">Star</span>
              </button>
              <button class="opt-btn" id="opt-schedule" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 18H5V9h14v12z"/>
                </svg>
                <span id="schedule-label" data-i18n="setDate">Date</span>
              </button>
            </div>
            <button class="composer-collapse" id="composer-collapse" type="button" title="Collapse" data-i18n-title="collapse">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
              </svg>
            </button>
          </div>

          <div class="composer-schedule" id="composer-schedule" hidden>
            <div class="sched-row">
              <span class="sched-label" data-i18n="dueLabel">Deadline</span>
              <input class="sched-input" id="due-date" type="date" />
              <input class="sched-input sched-input-time" id="due-time" type="time" />
            </div>
            <div class="sched-row">
              <span class="sched-label" data-i18n="remindLabel">Remind</span>
              <input class="sched-input" id="remind-at" type="datetime-local" />
            </div>
            <div class="sched-actions">
              <button class="sched-clear" id="schedule-clear" type="button" data-i18n="clearDate">Clear</button>
            </div>
          </div>
        </form>
      </div>

      <!-- Status -->
      <div class="status-banner" id="status" role="status" aria-live="polite" hidden></div>

      <!-- Content -->
      <div class="content" id="content">
        <section class="section" id="open-section">
          <ul class="group-card" id="open-list"></ul>
          <div class="empty-state" id="open-empty" hidden>
            <div class="empty-icon-wrap">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="var(--md-primary-container)" opacity="0.7"/>
                <path d="M8.5 12.5L11 15L16 9" stroke="var(--md-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <p class="empty-text" data-i18n="noOpen">No to-dos</p>
          </div>
        </section>
        <section class="section done-section" id="done-section">
          <h2 class="section-title" data-i18n="completed">Completed</h2>
          <ul class="group-card" id="done-list"></ul>
        </section>
      </div>

    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
