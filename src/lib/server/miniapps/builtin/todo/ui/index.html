<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Todo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">

      <!-- Backdrop for picker -->
      <div class="backdrop" id="backdrop" hidden></div>

      <!-- Top bar -->
      <header class="topbar" id="topbar">
        <button class="topbar-btn" id="list-picker-btn" type="button" aria-label="Lists">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="M4 7h14M4 11h14M4 15h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="topbar-center">
          <h1 class="topbar-title" id="current-list-name">All</h1>
        </div>
        <span class="topbar-count" id="open-count"></span>
      </header>

      <!-- List picker -->
      <nav class="list-picker" id="list-picker" hidden>
        <div class="lp-scroll">
          <button class="lp-item" data-list-id="" type="button">
            <span class="lp-icon" style="color:#8e8e93">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M5 8h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </span>
            <span class="lp-name">All</span>
            <span class="lp-count" id="lp-all-count"></span>
          </button>
          <div class="lp-lists" id="lp-lists"></div>
        </div>
        <button class="lp-add" id="lp-add" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>New List</span>
        </button>
      </nav>

      <!-- Search -->
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none">
          <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input class="search-input" id="search" type="text" autocomplete="off" placeholder="Search" />
      </div>

      <!-- Composer -->
      <div class="composer" id="composer">
        <form class="composer-form" id="composer-form" autocomplete="off">
          <div class="composer-header">
            <input class="composer-input" id="title" type="text" maxlength="300" placeholder="New To-Do" />
            <button class="composer-submit" type="submit">Add</button>
          </div>
          <div class="composer-options">
            <div class="opt-group">
              <button class="opt-btn" id="opt-priority" type="button">
                <span class="opt-dot pri-normal" id="pri-dot"></span>
                <span id="pri-label">Normal</span>
              </button>
              <button class="opt-btn" id="opt-pin" type="button">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" id="opt-pin-icon">
                  <path d="M8 1.5l1.8 4.2 4.5.4-3.4 3 1 4.4-3.9-2.3-3.9 2.3 1-4.4-3.4-3 4.5-.4z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
                </svg>
                <span>Star</span>
              </button>
            </div>
            <button class="composer-collapse" id="composer-collapse" type="button" title="Collapse">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M12 10l-4-4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </form>
      </div>

      <!-- Status -->
      <div class="status-banner" id="status" role="status" aria-live="polite" hidden></div>

      <!-- Content -->
      <div class="content" id="content">
        <section class="section" id="open-section">
          <ul class="group-card" id="open-list"></ul>
          <p class="empty-state" id="open-empty">No to-dos</p>
        </section>
        <section class="section done-section" id="done-section" style="display:none">
          <ul class="group-card" id="done-list"></ul>
        </section>
      </div>

    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
