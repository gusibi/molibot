<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Note</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="note-app" aria-label="Note">
      <header class="note-header">
        <span class="note-icon" aria-hidden="true">
          <svg class="keep-icon" viewBox="0 0 24 24" width="22" height="22">
            <path fill="#FFC107" d="M12 2A7 7 0 0 0 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26C17.81 13.47 19 11.38 19 9a7 7 0 0 0-7-7z"/>
            <path fill="#FFA000" d="M9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9v1z"/>
          </svg>
        </span>
        <button class="note-trigger" id="tab-selector-trigger" type="button" aria-label="View">
          <span class="note-trigger-title" id="current-tab-name" data-i18n="tabActive">笔记</span>
          <svg class="note-chevron" id="note-chevron" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </button>
        <div class="note-search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input id="search-input" class="note-search" type="text" placeholder="搜索笔记..." data-i18n-placeholder="searchPlaceholder" />
        </div>
        <div class="header-controls">
          <button id="view-toggle-btn" class="header-btn" type="button" title="切换视图" data-i18n-title="toggleView" aria-label="切换视图">
            <svg id="view-icon-grid" class="header-btn-icon" viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M4 11h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1zm1-6h4v4H5V5zm9-2a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1h-6zm5 6h-4V5h4v4zm-15 4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H4zm5 6H5v-4h4v4zm5-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1h-6zm5 6h-4v-4h4v4z"/>
            </svg>
            <svg id="view-icon-list" class="header-btn-icon hidden" viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
            </svg>
          </button>
          <button id="theme-toggle-btn" class="header-btn" type="button" title="切换主题" data-i18n-title="toggleTheme" aria-label="切换主题">
            <svg class="header-btn-icon" viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
            </svg>
            <span class="theme-badge" id="theme-badge">锤子</span>
          </button>
        </div>
      </header>

      <!-- Backdrop for tab picker -->
      <div class="backdrop" id="backdrop" hidden></div>

      <!-- Tab picker -->
      <nav class="tab-picker" id="tab-picker" hidden>
        <div class="tp-group">
          <button class="tp-item active" id="tp-tab-active" data-tab="active" type="button">
            <svg class="tp-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
            </svg>
            <span class="tp-label" data-i18n="tabActive">笔记</span>
            <span class="tp-count" id="tp-notes-count"></span>
          </button>
          <button class="tp-item" id="tp-tab-archived" data-tab="archived" type="button">
            <svg class="tp-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM12 17.5L6.5 12H10v-2h4v2h3.5L12 17.5zM5.12 5l.81-1h12l.94 1H5.12z"/>
            </svg>
            <span class="tp-label" data-i18n="tabArchived">归档</span>
            <span class="tp-count" id="tp-archived-count"></span>
          </button>
        </div>
        <div class="tp-divider" id="tp-tags-divider" hidden></div>
        <div class="tp-header" id="tp-tags-header" hidden data-i18n="tagsHeader">标签</div>
        <div class="tp-tags-list" id="tp-tags-list"></div>
      </nav>

      <!-- Google Material 风格便签编辑框 -->
      <section class="composer-container">
        <!-- 默认折叠占位条 -->
        <div id="composer-collapsed" class="composer-collapsed">
          <span class="collapsed-placeholder" data-i18n="takeNote">添加笔记...</span>
          <div class="collapsed-actions">
            <span class="icon-btn-sm" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- 展开卡片表单 -->
        <form class="note-composer hidden" id="composer" autocomplete="off" data-color="default">
          <div class="composer-header">
            <input
              class="note-input note-input-title"
              id="title"
              name="title"
              type="text"
              maxlength="300"
              data-i18n-placeholder="titlePlaceholder"
              placeholder="标题"
            />
            <button type="button" id="composer-pin-btn" class="icon-btn-sm composer-pin-toggle" title="固定笔记">
              <svg class="pin-icon" viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>
              </svg>
            </button>
            <input id="pin-checkbox" type="checkbox" class="hidden" />
          </div>

          <textarea
            class="note-input note-input-content"
            id="content"
            name="content"
            rows="3"
            maxlength="5000"
            data-i18n-placeholder="contentPlaceholder"
            placeholder="添加笔记..."
          ></textarea>

          <!-- 标签气泡输入区 -->
          <div class="composer-labels-bar">
            <svg viewBox="0 0 24 24" width="16" height="16" class="label-icon">
              <path fill="currentColor" d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z"/>
            </svg>
            <input id="labels-input" class="note-input-labels" type="text" placeholder="添加标签 (逗号分隔)" data-i18n-placeholder="labelsPlaceholder" />
          </div>
          
          <div class="composer-toolbar">
            <!-- Material 颜色选择圆圈调色盘 -->
            <div class="composer-color-palette">
              <!-- Swatch fills come from the shared `[data-color]` rules in
                   styles.css, so a swatch can never disagree with the surface
                   it paints, in either theme. -->
              <button type="button" class="color-dot active" data-color="default" title="默认"></button>
              <button type="button" class="color-dot" data-color="yellow" title="黄色"></button>
              <button type="button" class="color-dot" data-color="blue" title="蓝色"></button>
              <button type="button" class="color-dot" data-color="green" title="绿色"></button>
              <button type="button" class="color-dot" data-color="red" title="红色"></button>
              <button type="button" class="color-dot" data-color="purple" title="紫色"></button>
              <button type="button" class="color-dot" data-color="gray" title="灰色"></button>
              <select id="color-select" class="hidden">
                <option value="default" selected>默认</option>
                <option value="yellow">黄色</option>
                <option value="blue">蓝色</option>
                <option value="green">绿色</option>
                <option value="red">红色</option>
                <option value="purple">紫色</option>
                <option value="gray">灰色</option>
              </select>
            </div>
            
            <div class="composer-actions">
              <button type="button" id="composer-close-btn" class="note-btn-text" data-i18n="close">关闭</button>
              <button class="note-submit" type="submit" data-i18n="add">保存</button>
            </div>
          </div>
        </form>
      </section>

      <p class="note-status" id="status" role="status" aria-live="polite" hidden></p>

      <section class="note-group" id="pinned-group">
        <h2 class="note-group-title" data-i18n="pinnedSection">置顶</h2>
        <div class="note-grid" id="pinned-list"></div>
      </section>

      <section class="note-group" id="other-group">
        <h2 class="note-group-title" id="other-group-title" data-i18n="notesSection">其他</h2>
        <div class="note-grid" id="other-list"></div>
        <p class="note-empty" id="empty-msg" data-i18n="noNotes" hidden>暂无笔记</p>
      </section>
    </main>

    <!-- 全屏编辑视图 Full-page Note Editor Modal -->
    <div id="edit-modal" class="editor-fullscreen-modal hidden">
      <div class="editor-page-container" id="modal-card" data-color="default">
        <!-- 顶部导航栏 / Header with Back Button -->
        <header class="editor-page-header">
          <div class="editor-header-left">
            <button type="button" id="modal-back-btn" class="editor-back-btn" aria-label="返回" title="返回" data-i18n-title="back">
              <svg viewBox="0 0 24 24" width="20" height="20" class="back-chevron">
                <path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
              </svg>
              <span class="back-label" data-i18n="back">返回</span>
            </button>
          </div>
          <div class="editor-header-title">
            <span class="editor-title-text" data-i18n="editNote">编辑便签</span>
          </div>
          <div class="editor-header-right">
            <button type="button" id="modal-preview-btn" class="icon-btn-sm editor-preview-toggle" title="预览 Markdown" data-i18n-title="previewMarkdown">
              <svg class="preview-icon" viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <svg class="edit-icon hidden" viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
              </svg>
            </button>
            <button type="button" id="modal-pin-btn" class="icon-btn-sm composer-pin-toggle" title="固定笔记" data-i18n-title="pinNote">
              <svg class="pin-icon" viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>
              </svg>
            </button>
            <button type="button" id="modal-save-btn" class="note-submit editor-save-btn" data-i18n="saveEdit">保存</button>
          </div>
        </header>

        <!-- 编辑主内容区 / Editor Body with Paper ruled lines -->
        <div class="editor-page-body">
          <div id="editor-edit-fields" class="editor-edit-fields">
            <input id="edit-title" class="note-input note-input-title editor-title-input" type="text" placeholder="标题" data-i18n-placeholder="titlePlaceholder" />
            <textarea id="edit-content" class="note-input note-input-content editor-textarea" placeholder="笔记内容..." data-i18n-placeholder="contentPlaceholder"></textarea>
          </div>

          <div id="editor-preview-view" class="editor-preview-view hidden">
            <h1 id="preview-title" class="editor-preview-title hidden"></h1>
            <div id="preview-content" class="editor-preview-content"></div>
          </div>

          <div class="composer-labels-bar editor-labels-bar">
            <svg viewBox="0 0 24 24" width="16" height="16" class="label-icon">
              <path fill="currentColor" d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z"/>
            </svg>
            <input id="edit-labels" class="note-input-labels" type="text" placeholder="标签 (逗号分隔)" data-i18n-placeholder="labelsPlaceholder" />
          </div>
        </div>

        <!-- 底部工具栏 / Bottom palette bar -->
        <footer class="editor-page-footer">
          <div class="composer-color-palette" id="modal-color-palette">
            <button type="button" class="modal-color-dot active" data-color="default" title="默认"></button>
            <button type="button" class="modal-color-dot" data-color="yellow" title="黄色"></button>
            <button type="button" class="modal-color-dot" data-color="blue" title="蓝色"></button>
            <button type="button" class="modal-color-dot" data-color="green" title="绿色"></button>
            <button type="button" class="modal-color-dot" data-color="red" title="红色"></button>
            <button type="button" class="modal-color-dot" data-color="purple" title="紫色"></button>
            <button type="button" class="modal-color-dot" data-color="gray" title="灰色"></button>
          </div>
          <div class="editor-footer-info">
            <span class="editor-word-count" id="editor-word-count">0 字</span>
          </div>
          <div class="editor-footer-actions">
            <button type="button" id="modal-share-btn" class="editor-share-btn" data-i18n="share" title="生成分享图片" data-i18n-title="shareNote">
              <svg viewBox="0 0 24 24" width="16" height="16" class="share-btn-icon">
                <path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/>
              </svg>
              <span data-i18n="share">分享</span>
            </button>
          </div>
        </footer>
      </div>
    </div>

    <!-- 分享图片预览弹窗 / Share Image Preview Modal -->
    <div id="share-modal" class="share-preview-backdrop hidden">
      <div class="share-preview-dialog">
        <header class="share-preview-header">
          <h3 class="share-preview-title" data-i18n="sharePreviewTitle">便签分享图</h3>
          <button type="button" id="share-close-btn" class="share-preview-close" aria-label="关闭" title="关闭">×</button>
        </header>
        <div class="share-preview-body">
          <img id="share-preview-img" class="share-preview-img" alt="Note Preview" />
        </div>
        <footer class="share-preview-footer">
          <span class="share-preview-hint" id="share-preview-hint" data-i18n="saveImageHint">长按或右键图片即可复制/保存</span>
          <div class="share-preview-actions">
            <button type="button" id="share-copy-text-btn" class="share-action-btn" data-i18n="copyText">复制文本</button>
            <button type="button" id="share-copy-img-btn" class="share-action-btn" data-i18n="copyImage">复制图片</button>
            <button type="button" id="share-save-img-btn" class="share-action-btn primary" data-i18n="saveImage">保存图片</button>
          </div>
        </footer>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
