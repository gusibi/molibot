<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Note</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="note-app" aria-label="Note">
      <header class="note-header">
        <span class="note-icon" aria-hidden="true">
          <svg class="keep-icon" viewBox="0 0 24 24" width="22" height="22">
            <path fill="#FFC107" d="M12 2A7 7 0 0 0 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26C17.81 13.47 19 11.38 19 9a7 7 0 0 0-7-7z"/>
            <path fill="#FFA000" d="M9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9v1z"/>
          </svg>
        </span>
        <button class="note-trigger" id="tab-selector-trigger" type="button" aria-label="View">
          <span class="note-trigger-title" id="current-tab-name" data-i18n="tabActive">笔记</span>
          <svg class="note-chevron" id="note-chevron" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </button>
        <div class="note-search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input id="search-input" class="note-search" type="text" placeholder="搜索笔记..." data-i18n-placeholder="searchPlaceholder" />
        </div>
      </header>

      <!-- Backdrop for tab picker -->
      <div class="backdrop" id="backdrop" hidden></div>

      <!-- Tab picker -->
      <nav class="tab-picker" id="tab-picker" hidden>
        <button class="tp-item active" data-tab="active" type="button" data-i18n="tabActive">笔记</button>
        <button class="tp-item" data-tab="archived" type="button" data-i18n="tabArchived">归档</button>
      </nav>

      <!-- Google Material 风格便签编辑框 -->
      <section class="composer-container">
        <!-- 默认折叠占位条 -->
        <div id="composer-collapsed" class="composer-collapsed">
          <span class="collapsed-placeholder" data-i18n="takeNote">添加笔记...</span>
          <div class="collapsed-actions">
            <span class="icon-btn-sm" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- 展开卡片表单 -->
        <form class="note-composer hidden" id="composer" autocomplete="off" data-color="default">
          <div class="composer-header">
            <input
              class="note-input note-input-title"
              id="title"
              name="title"
              type="text"
              maxlength="300"
              data-i18n-placeholder="titlePlaceholder"
              placeholder="标题"
            />
            <button type="button" id="composer-pin-btn" class="icon-btn-sm composer-pin-toggle" title="固定笔记">
              <svg class="pin-icon" viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>
              </svg>
            </button>
            <input id="pin-checkbox" type="checkbox" class="hidden" />
          </div>

          <textarea
            class="note-input note-input-content"
            id="content"
            name="content"
            rows="3"
            maxlength="5000"
            data-i18n-placeholder="contentPlaceholder"
            placeholder="添加笔记..."
          ></textarea>

          <!-- 标签气泡输入区 -->
          <div class="composer-labels-bar">
            <svg viewBox="0 0 24 24" width="16" height="16" class="label-icon">
              <path fill="currentColor" d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z"/>
            </svg>
            <input id="labels-input" class="note-input-labels" type="text" placeholder="添加标签 (逗号分隔)" data-i18n-placeholder="labelsPlaceholder" />
          </div>
          
          <div class="composer-toolbar">
            <!-- Material 颜色选择圆圈调色盘 -->
            <div class="composer-color-palette">
              <!-- Swatch fills come from the shared `[data-color]` rules in
                   styles.css, so a swatch can never disagree with the surface
                   it paints, in either theme. -->
              <button type="button" class="color-dot active" data-color="default" title="默认"></button>
              <button type="button" class="color-dot" data-color="yellow" title="黄色"></button>
              <button type="button" class="color-dot" data-color="blue" title="蓝色"></button>
              <button type="button" class="color-dot" data-color="green" title="绿色"></button>
              <button type="button" class="color-dot" data-color="red" title="红色"></button>
              <button type="button" class="color-dot" data-color="purple" title="紫色"></button>
              <button type="button" class="color-dot" data-color="gray" title="灰色"></button>
              <select id="color-select" class="hidden">
                <option value="default" selected>默认</option>
                <option value="yellow">黄色</option>
                <option value="blue">蓝色</option>
                <option value="green">绿色</option>
                <option value="red">红色</option>
                <option value="purple">紫色</option>
                <option value="gray">灰色</option>
              </select>
            </div>
            
            <div class="composer-actions">
              <button type="button" id="composer-close-btn" class="note-btn-text" data-i18n="close">关闭</button>
              <button class="note-submit" type="submit" data-i18n="add">保存</button>
            </div>
          </div>
        </form>
      </section>

      <p class="note-status" id="status" role="status" aria-live="polite" hidden></p>

      <section class="note-group" id="pinned-group">
        <h2 class="note-group-title" data-i18n="pinnedSection">置顶</h2>
        <div class="note-grid" id="pinned-list"></div>
      </section>

      <section class="note-group" id="other-group">
        <h2 class="note-group-title" id="other-group-title" data-i18n="notesSection">其他</h2>
        <div class="note-grid" id="other-list"></div>
        <p class="note-empty" id="empty-msg" data-i18n="noNotes" hidden>暂无笔记</p>
      </section>
    </main>

    <!-- 编辑模态弹窗 Modal -->
    <div id="edit-modal" class="modal-backdrop hidden">
      <div class="modal-card" id="modal-card" data-color="default">
        <div class="modal-header">
          <input id="edit-title" class="note-input note-input-title" type="text" placeholder="标题" data-i18n-placeholder="titlePlaceholder" />
          <button type="button" id="modal-pin-btn" class="icon-btn-sm composer-pin-toggle" title="固定笔记">
            <svg class="pin-icon" viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>
            </svg>
          </button>
        </div>

        <textarea id="edit-content" class="note-input note-input-content" rows="6" placeholder="笔记内容..." data-i18n-placeholder="contentPlaceholder"></textarea>

        <div class="composer-labels-bar">
          <svg viewBox="0 0 24 24" width="16" height="16" class="label-icon">
            <path fill="currentColor" d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z"/>
          </svg>
          <input id="edit-labels" class="note-input-labels" type="text" placeholder="标签 (逗号分隔)" data-i18n-placeholder="labelsPlaceholder" />
        </div>

        <div class="composer-toolbar">
          <div class="composer-color-palette" id="modal-color-palette">
            <button type="button" class="modal-color-dot active" data-color="default" title="默认"></button>
            <button type="button" class="modal-color-dot" data-color="yellow" title="黄色"></button>
            <button type="button" class="modal-color-dot" data-color="blue" title="蓝色"></button>
            <button type="button" class="modal-color-dot" data-color="green" title="绿色"></button>
            <button type="button" class="modal-color-dot" data-color="red" title="红色"></button>
            <button type="button" class="modal-color-dot" data-color="purple" title="紫色"></button>
            <button type="button" class="modal-color-dot" data-color="gray" title="灰色"></button>
          </div>

          <div class="composer-actions">
            <button type="button" id="modal-cancel-btn" class="note-btn-text" data-i18n="cancel">取消</button>
            <button type="button" id="modal-save-btn" class="note-submit" data-i18n="saveEdit">保存修改</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
