<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meeting Notes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="meeting-app">
      <header class="app-bar">
        <div class="app-bar-text">
          <h1 class="app-bar-title" data-i18n="title">Meeting Notes</h1>
          <p class="app-bar-subtitle" data-i18n="subtitle">Record, transcribe, and recover meeting notes.</p>
        </div>
        <button id="new" class="btn btn-filled" data-i18n="newMeeting">New meeting</button>
      </header>

      <p id="status" class="banner" role="status" hidden></p>

      <section id="recording" class="recording-card" hidden>
        <div class="recording-line">
          <span class="record-dot" aria-hidden="true"></span>
          <strong id="recording-title" class="recording-title"></strong>
          <time id="timer" class="recording-timer">00:00</time>
        </div>
        <button id="stop" class="btn btn-danger" data-i18n="stop">Stop and generate notes</button>
      </section>

      <div class="layout">
        <nav class="pane pane-list" aria-label="Meetings">
          <ul id="meetings" class="meeting-list"></ul>
          <p id="empty" class="placeholder" data-i18n="empty">No meetings yet.</p>
        </nav>

        <article id="detail" class="pane pane-detail">
          <p class="placeholder" data-i18n="select">Select a meeting.</p>
        </article>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
