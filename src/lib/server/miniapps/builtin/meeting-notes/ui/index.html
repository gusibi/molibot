<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Notes</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="meeting-app"><header><div><h1 data-i18n="title">Meeting Notes</h1><p data-i18n="subtitle">Record, transcribe, and recover meeting notes.</p></div><button id="new" class="primary" data-i18n="newMeeting">New meeting</button></header><p id="status" role="status" hidden></p><section id="recording" hidden><div class="recording-line"><span class="record-dot"></span><strong id="recording-title"></strong><time id="timer">00:00</time></div><button id="stop" class="danger" data-i18n="stop">Stop and generate notes</button></section><div class="layout"><nav><ul id="meetings"></ul><p id="empty" data-i18n="empty">No meetings yet.</p></nav><article id="detail"><p class="placeholder" data-i18n="select">Select a meeting.</p></article></div></main><script type="module" src="app.js"></script></body></html>
